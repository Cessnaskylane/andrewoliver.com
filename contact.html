<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-title">Andrew Oliver</span>
        <span class="brand-kicker">Film &amp; brand editor</span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="index.html">Work</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>

  <main id="main" class="main">
    <section class="page-hero">
      <h1>Contact</h1>
      <p>Available for brand films, entrepreneur stories, trailers, and sizzle reels.</p>
    </section>
    <div class="contact-card">
      <p style="margin:0;color:var(--fg-dim);font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;font-weight:600;">Email</p>
      <a class="email-link" href="mailto:oliverandy@me.com">oliverandy@me.com</a>
      <p class="contact-note">Prefer email — include a brief on timeline, deliverables, and references if helpful.</p>
    </div>
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; <span id="year"></span> Andrew Oliver</p>
      <p><a href="mailto:oliverandy@me.com">oliverandy@me.com</a></p>
    </div>
  </footer>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    const header = document.querySelector(".site-header");
    const onScroll = () => header.classList.toggle("is-scrolled", window.scrollY > 8);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
  </script>
